
<!DOCTYPE html>
<html lang="es">
<head>
      
<script src="https://accounts.google.com/gsi/client" async defer></script>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>STOCK DEPO Q3i</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 20px;
}
h2 { text-align: center; }
button, input {
  box-sizing: border-box;
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  font-size: 18px;
  border-radius: 10px;
}
button {
  background: #176b40;
  color: white;
  border: none;
}
#video {
  width: 100%;
  display: none;
  border-radius: 12px;
}
#resultado {
  background: white;
  padding: 16px;
  margin-top: 15px;
  border-radius: 10px;
}
</style>
</head>
<body>

<h2>STOCK DEPO</h2>

<div id="login">
  <h3>Acceso al depósito</h3>
  <p>Ingresá con tu cuenta de Google autorizada.</p>

  <div id="googleButton"></div>

  <p id="estadoLogin"></p>
</div>

<input id="codigo"
       placeholder="SKU o código de barras">

<button onclick="buscar()">BUSCAR</button>
<button onclick="abrirCamara()">ESCANEAR</button>
<button onclick="cerrarCamara()">CERRAR CÁMARA</button>

<video id="video" autoplay playsinline></video>

<div id="resultado">Esperando producto...</div>

<script>
let stream = null;
let detector = null;
let escaneando = false;


const CLIENT_ID = "463384720815-n0tlr1squ80f2h2srkfuiodd63n0alhd.apps.googleusercontent.com";

function iniciarGoogle() {
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: recibirCredencial
  });

  google.accounts.id.renderButton(
    document.getElementById("googleButton"),
    {
      theme: "outline",
      size: "large",
      text: "signin_with"
    }
  );
}
let credencialGoogle = null;
async function recibirCredencial(response) {
  const estado = document.getElementById("estadoLogin");

  if (!response.credential) {
    estado.textContent = "No se pudo iniciar sesión.";
    return;
  }

  estado.textContent = "Verificando usuario...";

  try {
    const respuesta = await fetch(
      "https://pos-depo-api-463384720815.southamerica-east1.run.app/auth",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          credential: response.credential
        })
      }
    );

    const datos = await respuesta.json();

    if (respuesta.ok && datos.ok && datos.autorizado) {
  credencialGoogle = response.credential;
  estado.textContent = "Acceso autorizado - " + datos.rol;
    } else {
      estado.textContent =
        "Acceso denegado: " + (datos.error || "Error desconocido");
    }

  } catch (error) {
    console.error(error);
    estado.textContent = "Error de conexión con POS DEPO";
  }
}


window.addEventListener("load", iniciarGoogle);

      

async function buscar() {
  const codigo = document.getElementById("codigo").value.trim();
  const resultado = document.getElementById("resultado");

  if (!codigo) {
    resultado.textContent = "Ingresá un código";
    return;
  }

  if (!credencialGoogle) {
    resultado.textContent = "Primero iniciá sesión con Google";
    return;
  }

  resultado.textContent = "Buscando producto...";

  try {
    const respuesta = await fetch(
      "https://pos-depo-api-463384720815.southamerica-east1.run.app/stock",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          credential: credencialGoogle,
          codigo: codigo
        })
      }
    );

    const datos = await respuesta.json();

    if (!respuesta.ok || !datos.ok) {
      if (respuesta.status === 401) {
        credencialGoogle = null;
        resultado.textContent = "Sesión vencida. Iniciá sesión nuevamente.";
      } else {
        resultado.textContent = datos.error || "Error al buscar";
      }
      return;
    }

    const producto = datos.producto;

    resultado.textContent =
      "SKU: " + producto.sku + "\n" +
      "Descripción: " + producto.descripcion + "\n" +
      "Stock disponible: " + producto.stock;

    resultado.style.whiteSpace = "pre-line";

  } catch (error) {
    console.error(error);
    resultado.textContent = "Error de conexión con el servidor";
  }
}

async function abrirCamara() {
  if (!("BarcodeDetector" in window)) {
    alert("Este navegador no admite BarcodeDetector");
    return;
  }

  try {
    detector = new BarcodeDetector({
      formats: ["ean_13", "ean_8", "code_128", "code_39", "upc_a"]
    });

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    const video = document.getElementById("video");
    video.srcObject = stream;
    video.style.display = "block";
    await video.play();

    escaneando = true;
    detectar();
  } catch (error) {
    cerrarCamara();
    alert("Error de cámara: " + error.message);
  }
}

async function detectar() {
  if (!escaneando) return;

  try {
    const codigos = await detector.detect(
      document.getElementById("video")
    );

    if (codigos.length > 0) {
      document.getElementById("codigo").value =
        codigos[0].rawValue;

      cerrarCamara();
      buscar();
      return;
    }
  } catch (error) {
    console.log(error);
  }

  if (escaneando) setTimeout(detectar, 250);
}

function cerrarCamara() {
  escaneando = false;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  document.getElementById("video").style.display = "none";
}
</script>

</body>
</html>
