
<!DOCTYPE html>
<html lang="es">
<head>
      
<script src="https://accounts.google.com/gsi/client" async defer></script>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>STOCK DEPO Q3i</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 20px;
}
h2 { text-align: center; }
button, input {
  box-sizing: border-box;
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  font-size: 18px;
  border-radius: 10px;
}
button {
  background: #176b40;
  color: white;
  border: none;
}
#video {
  width: 100%;
  display: none;
  border-radius: 12px;
}
#resultado {
  background: white;
  padding: 16px;
  margin-top: 15px;
  border-radius: 10px;
}
</style>
</head>
<body>

<h2>STOCK DEPO</h2>

<div id="login">
  <h3>Acceso al depósito</h3>
  <p>Ingresá con tu cuenta de Google autorizada.</p>

  <div id="googleButton"></div>

  <p id="estadoLogin"></p>
</div>

<input id="codigo"
       placeholder="SKU o código de barras">

<button onclick="buscar()">BUSCAR</button>
<button onclick="abrirCamara()">ESCANEAR</button>
<button onclick="cerrarCamara()">CERRAR CÁMARA</button>

<video id="video" autoplay playsinline></video>

<div id="resultado">Esperando producto...</div>

<script>
let stream = null;
let detector = null;
let escaneando = false;


const CLIENT_ID = "463384720815-n0tlr1squ80f2h2srkfuiodd63n0alhd.apps.googleusercontent.com";

function iniciarGoogle() {
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: recibirCredencial
  });

  google.accounts.id.renderButton(
    document.getElementById("googleButton"),
    {
      theme: "outline",
      size: "large",
      text: "signin_with"
    }
  );
}

function recibirCredencial(response) {
  // El token debe validarse en el servidor.
  // Por ahora no habilitamos acceso al inventario.
  document.getElementById("estadoLogin").textContent =
    response.credential
      ? "Google devolvió una credencial. Falta validarla."
      : "No se pudo iniciar sesión.";
}

window.addEventListener("load", iniciarGoogle);

      
function buscar() {
  const codigo = document.getElementById("codigo").value.trim();
  document.getElementById("resultado").textContent =
    codigo ? "Código leído: " + codigo : "Ingresá un código";
}

async function abrirCamara() {
  if (!("BarcodeDetector" in window)) {
    alert("Este navegador no admite BarcodeDetector");
    return;
  }

  try {
    detector = new BarcodeDetector({
      formats: ["ean_13", "ean_8", "code_128", "code_39", "upc_a"]
    });

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    const video = document.getElementById("video");
    video.srcObject = stream;
    video.style.display = "block";
    await video.play();

    escaneando = true;
    detectar();
  } catch (error) {
    cerrarCamara();
    alert("Error de cámara: " + error.message);
  }
}

async function detectar() {
  if (!escaneando) return;

  try {
    const codigos = await detector.detect(
      document.getElementById("video")
    );

    if (codigos.length > 0) {
      document.getElementById("codigo").value =
        codigos[0].rawValue;

      cerrarCamara();
      buscar();
      return;
    }
  } catch (error) {
    console.log(error);
  }

  if (escaneando) setTimeout(detectar, 250);
}

function cerrarCamara() {
  escaneando = false;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  document.getElementById("video").style.display = "none";
}
</script>

</body>
</html>
